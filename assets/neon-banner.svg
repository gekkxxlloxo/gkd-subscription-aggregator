<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="GKD Subscription Aggregator neon banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05040f"/>
      <stop offset="55%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#140a2b"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="18%" cy="26%" r="46%">
      <stop offset="0%" stop-color="#ff2d95" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="82%" cy="74%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="50%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff2d95" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="neonBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="2.2" result="b0"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b0"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#pinkGlow)"/>
  <rect width="1200" height="340" fill="url(#cyanGlow)"/>
  <rect width="1200" height="340" fill="url(#violetGlow)"/>

  <g stroke="#00f0ff" stroke-width="1" opacity="0.20">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <g opacity="0.55" filter="url(#neonSmall)">
    <circle cx="150" cy="150" r="86" fill="none" stroke="#ff2d95" stroke-width="2" stroke-dasharray="6 10"/>
    <circle cx="150" cy="150" r="66" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.55"/>
    <circle cx="1050" cy="170" r="96" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 12"/>
    <circle cx="1050" cy="170" r="72" fill="none" stroke="#b026ff" stroke-width="1" opacity="0.6"/>
  </g>

  <g stroke="url(#floorFade)" fill="none" opacity="0.50">
    <path d="M600 176 L-160 340 M600 176 L40 340 M600 176 L240 340 M600 176 L440 340 M600 176 L600 340 M600 176 L760 340 M600 176 L960 340 M600 176 L1160 340 M600 176 L1360 340" stroke-width="1.4"/>
    <path d="M0 186 H1200 M0 200 H1200 M0 218 H1200 M0 242 H1200 M0 274 H1200 M0 314 H1200" stroke-width="1.2"/>
  </g>

  <g filter="url(#neonBig)" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="138" font-size="84" font-weight="900" letter-spacing="10" fill="#ff2d95">GKD</text>
    <text x="600" y="138" font-size="84" font-weight="900" letter-spacing="10" fill="none" stroke="#ffd6ec" stroke-width="1.2">GKD</text>
  </g>
  <g filter="url(#neonSmall)" font-family="'Courier New',monospace" text-anchor="middle">
    <text x="600" y="182" font-size="30" font-weight="bold" letter-spacing="9" fill="#00f0ff">SUBSCRIPTION AGGREGATOR</text>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle">
    <text x="600" y="222" font-size="14" letter-spacing="5" fill="#c9a7ff">ONE LINK  /  ALL RULES  /  ZERO MAINTENANCE</text>
  </g>

  <g filter="url(#neonSmall)">
    <rect x="470" y="250" width="260" height="2" fill="url(#neonStroke)"/>
  </g>
  <g font-family="'Courier New',monospace" text-anchor="middle" font-size="13" letter-spacing="4">
    <text x="600" y="278" fill="#7cf9ff">AUTO SYNC</text>
    <text x="525" y="278" fill="#ff7ac0">11</text>
    <text x="675" y="278" fill="#ff7ac0">1098+</text>
    <text x="600" y="296" fill="#8f7ab5" font-size="11">SOURCES            APPS</text>
  </g>

  <rect width="1200" height="340" fill="url(#scanlines)" opacity="0.45"/>
  <rect x="1" y="1" width="1198" height="338" fill="none" stroke="url(#neonStroke)" stroke-width="2" opacity="0.55"/>
</svg>
