name: Sync GKD Subscriptions

on:
  # 每天北京时间早上 8 点执行（UTC 时间 00:00）
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

# 工作流权限配置 - 为自动化任务提供必要的权限
permissions:
  contents: write      # 允许推送更改到仓库（更新 merged.json5）
  actions: write       # 允许访问 workflow 运行历史
  packages: write      # 允许发布 package（预留扩展功能）
  security-events: write  # 允许上传安全扫描结果（预留）

env:
  # 配置信息
  SUBSCRIPTION_FILE: subscriptions.json5
  MERGED_FILE: merged.json5
  SOURCE_LIST: source-list.json

jobs:
  sync-and-merge:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      # 4. 执行同步和合并脚本
      - name: Run sync and merge script
        run: |
          python scripts/sync_and_merge.py
      
      # 5. 提交并推送更新
      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          # 只有在有更改时才提交
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update GKD subscriptions [skip ci]"
            git push
          fi
