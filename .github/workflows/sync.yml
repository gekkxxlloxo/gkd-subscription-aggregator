name: Sync GKD Subscriptions

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 # 每天 UTC 00:00 (北京时间 08:00)
  workflow_dispatch: # 支持手动触发

# 工作流权限配置 - 为自动化任务提供必要的权限
permissions:
  contents: write      # 允许推送更改到仓库（更新 merged.json5）
  actions: write       # 允许访问 workflow 运行历史
  packages: write      # 允许发布 package（预留扩展功能）
  security-events: write  # 允许上传安全扫描结果（预留）

jobs:
  sync-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests json5

      - name: Run sync and merge script
        run: python scripts/sync_and_merge.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: auto-update GKD subscriptions" || exit 0
          git push
