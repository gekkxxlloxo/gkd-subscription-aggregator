# Ruff 配置文件
# 用于 Python 代码静态分析

# Python 版本（顶层字段，不能放进 [lint] 段，否则 Ruff 拒绝解析配置）
target-version = "py311"

[lint]
# 只启用「会导致代码真正出错」的规则，不启用纯风格/美化规则。
# 本项目的目标是拦截 AI 写坏代码（语法错误、未定义变量、未用导入、路径字符错误），
# 不是做代码美化。风格规则(空白/排序/简化建议)会产生大量噪音并让 CI 误报失败。
select = [
    "E",      # pycodestyle 错误（语法/缩进等）
    "F",      # Pyflakes（未定义变量、未用导入、重复定义等）
]

# 忽略的规则
ignore = [
    "E501",   # 行长度限制（与字符检查的长 URL 场景冲突）
    "F541",   # 无占位符的 f-string（无害，避免为纯风格问题卡住 CI）
]

[format]
# 格式化配置
quote-style = "double"
indent-style = "space"
line-ending = "lf"
